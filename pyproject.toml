[project]
name = "innout-locator-mcp"
version = "0.1.0"
description = "MCP server that lists In-N-Out Burger locations in a given state, sorted by distance from the caller."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
innout-locator-mcp = "innout_locator.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/innout_locator"]
